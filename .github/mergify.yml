queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - base=main
      - label=automerge
    commit_message_format:
      title: pr-title
      body: pr-body
    merge_conditions:
      - "#approved-reviews-by>=1"
      - base=main
      - label=automerge
    merge_method: squash

pull_request_rules:
  - name: backport patches to v8.8.x branch
    conditions:
      - base=main
      - label=backport-to-v8.8.x
    actions:
      backport:
        branches:
          - release/v8.8.x
  - name: backport patches to v8.7.x branch
    conditions:
      - base=main
      - label=backport-to-v8.7.x
    actions:
      backport:
        branches:
          - release/v8.7.x
  - name: backport patches to v1.0.x capability branch
    conditions:
      - base=main
      - label=backport-capability-to-v1.0.x
    actions:
      backport:
        branches:
          - capability/release/v1.0.x
  - name: automerge to main with label automerge and branch protection passing
    conditions: []
    actions:
      queue:
        name: default
