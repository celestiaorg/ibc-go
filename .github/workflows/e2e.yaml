name: Tests / E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'e2e/**'
      - 'Dockerfile'
      - 'cmd/build_test_matrix/**'
      - '.github/workflows/e2e.yaml'
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'e2e/**'
      - 'Dockerfile'
      - 'cmd/build_test_matrix/**'
      - '.github/workflows/e2e.yaml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CHAIN_IMAGE: ghcr.io/celestiaorg/ibc-go-simd
  CHAIN_A_TAG: e2e-${{ github.sha }}
  CHAIN_B_TAG: e2e-${{ github.sha }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - id: matrix
        name: Discover e2e tests
        env:
          TEST_EXCLUSIONS: TestUpgradeTestSuite
        run: |
          matrix=$(go run -mod=readonly ./cmd/build_test_matrix)
          jq -e '.include | length > 0' <<< "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Build current checkout
        run: docker build --build-arg IBC_GO_VERSION="$CHAIN_A_TAG" -t "$CHAIN_IMAGE:$CHAIN_A_TAG" .
      - name: Check simd binary
        run: docker run --rm "$CHAIN_IMAGE:$CHAIN_A_TAG" version
      - name: Save image
        run: docker save "$CHAIN_IMAGE:$CHAIN_A_TAG" | gzip > simd-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-simd
          path: simd-image.tar.gz
          retention-days: 1
  tests:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: e2e-simd
      - name: Load image
        run: docker load -i simd-image.tar.gz
      - name: Run test
        working-directory: e2e
        env:
          E2E_CONFIG_PATH: ${{ github.workspace }}/e2e/sample.config.yaml
          E2E_TEST: ${{ matrix.test }}
          E2E_ENTRYPOINT: ${{ matrix.entrypoint }}
        run: make e2e-test test="$E2E_TEST" entrypoint="$E2E_ENTRYPOINT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.entrypoint }}-${{ matrix.test }}
          path: e2e/diagnostics
          if-no-files-found: ignore
          retention-days: 5
